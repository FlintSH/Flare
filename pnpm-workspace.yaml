allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  oxc-resolver: true
  prisma: true
  sharp: true
  tesseract.js: true
  unrs-resolver: true

# addressing security advisories for transitive deps
overrides:
  'postcss@<8.5.18': ^8.5.25
  'sharp@<0.35.0': ^0.35.3
  'brace-expansion@<1.1.17': ^1.1.18
  'brace-expansion@>=2.0.0 <2.1.3': ^2.1.4
  # Prisma 6 pins deepmerge-ts 7; 8 fixes recursive-object stack exhaustion.
  '@prisma/config@6>deepmerge-ts': 8.0.2
  # Keep Vitest’s Vite on a patched release.
  'vite@>=8.0.0 <8.1.6': ^8.1.6
