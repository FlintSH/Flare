name: PR Preview Controller

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_run:
    workflows: [PR Preview Image]
    types: [requested, in_progress, completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  packages: write

# Reconcile every PR, so GitHub collapsing queued runs cannot lose a close event.
# Never cancel a running infrastructure mutation halfway through provisioning.
concurrency:
  group: pr-preview-controller
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Only trusted controller code from the repository's default branch runs here.
      # Never check out PR code, install its dependencies, or execute its image.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install trusted deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
          npm install --global @railway/cli@5.54.0

      - name: Reconcile preview deployments and PR comments
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_ENABLED: ${{ vars.PREVIEW_ENABLED }}
          PREVIEW_MONTHLY_BUDGET_USD: ${{ vars.PREVIEW_MONTHLY_BUDGET_USD }}
          PREVIEW_RAILWAY_PROJECT_ID: ${{ vars.PREVIEW_RAILWAY_PROJECT_ID }}
          PREVIEW_RAILWAY_APP_SERVICE_ID: ${{ vars.PREVIEW_RAILWAY_APP_SERVICE_ID }}
          PREVIEW_RAILWAY_GATEWAY_SERVICE_ID: ${{ vars.PREVIEW_RAILWAY_GATEWAY_SERVICE_ID }}
          PREVIEW_GATEWAY_IMAGE: ${{ vars.PREVIEW_GATEWAY_IMAGE }}
          RAILWAY_API_TOKEN: ${{ secrets.PREVIEW_RAILWAY_API_TOKEN }}
        run: python3 scripts/preview/controller.py
