name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flare_test
          POSTGRES_PASSWORD: public-ci-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must run before setup-node so the pnpm store can be located for caching.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm tsc --noEmit

      - name: Test
        env:
          PGPASSWORD: public-ci-test-password
          FLARE_EMAIL_AUTH_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_email_test
          FLARE_EMAIL_DELIVERY_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_email_delivery
          FLARE_EMAIL_CONFIG_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_email_config_test
          FLARE_CUSTOMIZATION_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_customization_test
          FLARE_SETUP_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_setup_test
          FLARE_TAGS_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_tags_test_ci
          FLARE_ROLES_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_roles_test_ci
          FLARE_AVATAR_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_avatar_test_ci
          FLARE_FOLDERS_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_folders_test_ci
          FLARE_SECURITY_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_security_test_ci
          FLARE_TIMELINE_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_timeline_test_ci
          FLARE_AUDIT_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_audit_test
          FLARE_ARCHIVE_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_archive_test_ci
          FLARE_INVITES_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_invites_test_ci
        run: |
          for database in flare_email_test flare_email_delivery flare_email_config_test flare_customization_test flare_setup_test flare_tags_test_ci flare_folders_test_ci flare_roles_test_ci flare_avatar_test_ci flare_security_test_ci flare_timeline_test_ci flare_audit_test flare_archive_test_ci flare_invites_test_ci; do
            createdb -h 127.0.0.1 -U flare_test "$database"
            DATABASE_URL="postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/$database" pnpm prisma migrate deploy
          done
          pnpm test

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check
