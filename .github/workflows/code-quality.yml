name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a pull request replaces the run for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The database for the test suites. Started here in the background, its
      # image downloads while dependencies install; as a service container it
      # held up every step until that download had finished.
      - name: Start PostgreSQL
        run: |
          docker run --detach --name postgres \
            --env POSTGRES_USER=flare_test \
            --env POSTGRES_PASSWORD=public-ci-test-password \
            --env POSTGRES_DB=postgres \
            --publish 5432:5432 \
            postgres:16 > "$RUNNER_TEMP/postgres-start.log" 2>&1 &

      # Must run before setup-node so the pnpm store can be located for caching.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: pnpm install --frozen-lockfile

      # The type check, lint and format check keep their results and redo only
      # the files that changed. A change to the lockfile or to a tool's
      # configuration starts them afresh. Restored after the install, which
      # would otherwise replace node_modules.
      - name: Name the check results
        id: check-key
        run: echo "key=checks-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'tsconfig.json', 'eslint.config.mjs', '.prettierrc', '.prettierignore') }}" >> "$GITHUB_OUTPUT"

      - name: Restore check results
        id: check-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tsconfig.tsbuildinfo
            node_modules/.cache/eslint
            node_modules/.cache/prettier
          key: ${{ steps.check-key.outputs.key }}-${{ github.sha }}
          restore-keys: ${{ steps.check-key.outputs.key }}-

      - name: Type Check
        run: pnpm tsc --noEmit

      - name: Test
        env:
          PGPASSWORD: public-ci-test-password
          FLARE_EMAIL_AUTH_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_email_test
          FLARE_EMAIL_DELIVERY_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_email_delivery
          FLARE_EMAIL_CONFIG_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_email_config_test
          FLARE_CUSTOMIZATION_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_customization_test
          FLARE_SETUP_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_setup_test
          FLARE_TAGS_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_tags_test_ci
          FLARE_ROLES_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_roles_test_ci
          FLARE_AVATAR_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_avatar_test_ci
          FLARE_FOLDERS_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_folders_test_ci
          FLARE_SECURITY_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_security_test_ci
          FLARE_TIMELINE_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_timeline_test_ci
          FLARE_AUDIT_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_audit_test
          FLARE_ARCHIVE_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_archive_test_ci
          FLARE_INVITES_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_invites_test_ci
          FLARE_EXPIRY_DATABASE_URL: postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_expiry_test
        run: |
          ready=false
          for attempt in $(seq 1 90); do
            if pg_isready -q -h 127.0.0.1 -U flare_test; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "PostgreSQL did not start"
            cat "$RUNNER_TEMP/postgres-start.log" || true
            docker logs postgres || true
            exit 1
          fi

          # Apply the migrations once, then copy that database for each suite.
          # A copy takes a fraction of a second; migrating each one took over
          # two seconds.
          createdb -h 127.0.0.1 -U flare_test flare_migrated
          DATABASE_URL="postgresql://flare_test:public-ci-test-password@127.0.0.1:5432/flare_migrated" pnpm prisma migrate deploy
          for database in flare_email_test flare_email_delivery flare_email_config_test flare_customization_test flare_setup_test flare_tags_test_ci flare_folders_test_ci flare_roles_test_ci flare_avatar_test_ci flare_security_test_ci flare_timeline_test_ci flare_audit_test flare_archive_test_ci flare_invites_test_ci flare_expiry_test; do
            createdb -h 127.0.0.1 -U flare_test -T flare_migrated "$database"
          done
          pnpm test

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # About a megabyte, so every passing run saves it and the next push to
      # the same pull request rechecks only what changed since this one.
      - name: Save check results
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tsconfig.tsbuildinfo
            node_modules/.cache/eslint
            node_modules/.cache/prettier
          key: ${{ steps.check-key.outputs.key }}-${{ github.sha }}
