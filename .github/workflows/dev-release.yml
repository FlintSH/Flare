name: Rolling Release

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'package.json' ]

# Publish each rolling image and its release metadata together before starting
# another run, so overlapping builds cannot advertise different commits.
concurrency:
  group: rolling-release
  cancel-in-progress: false

jobs:
  get-commit-info:
    name: Get Commit Info
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit_info.outputs.sha }}
      date: ${{ steps.commit_info.outputs.date }}
      message: ${{ steps.commit_info.outputs.COMMIT_MSG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit info
        id: commit_info
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_DATE=$(git log -1 --pretty=%cd --date=short)
          
          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "date=$COMMIT_DATE" >> $GITHUB_OUTPUT
          echo "COMMIT_MSG<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  docker-amd64:
    name: Build and Push Docker Image (AMD64)
    runs-on: ubuntu-latest
    needs: [get-commit-info]
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (AMD64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            FLARE_RELEASE_CHANNEL=rolling
            FLARE_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/flintsh/flare:rolling-amd64
            ghcr.io/flintsh/flare:rolling-${{ needs.get-commit-info.outputs.sha }}-amd64
            flintsh/flare:rolling-amd64
            flintsh/flare:rolling-${{ needs.get-commit-info.outputs.sha }}-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  docker-arm64:
    name: Build and Push Docker Image (ARM64)
    runs-on: ubuntu-24.04-arm
    needs: [get-commit-info]
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            FLARE_RELEASE_CHANNEL=rolling
            FLARE_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/flintsh/flare:rolling-arm64
            ghcr.io/flintsh/flare:rolling-${{ needs.get-commit-info.outputs.sha }}-arm64
            flintsh/flare:rolling-arm64
            flintsh/flare:rolling-${{ needs.get-commit-info.outputs.sha }}-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  docker-manifest:
    name: Create Multi-Architecture Manifest
    runs-on: ubuntu-latest
    needs: [get-commit-info, docker-amd64, docker-arm64]
    permissions:
      packages: write
      contents: read

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          # GitHub Container Registry manifests
          docker buildx imagetools create -t ghcr.io/flintsh/flare:rolling \
            ghcr.io/flintsh/flare:rolling-${{ needs.get-commit-info.outputs.sha }}-amd64 \
            ghcr.io/flintsh/flare:rolling-${{ needs.get-commit-info.outputs.sha }}-arm64
          
          docker buildx imagetools create -t ghcr.io/flintsh/flare:rolling-${{ needs.get-commit-info.outputs.sha }} \
            ghcr.io/flintsh/flare:rolling-${{ needs.get-commit-info.outputs.sha }}-amd64 \
            ghcr.io/flintsh/flare:rolling-${{ needs.get-commit-info.outputs.sha }}-arm64
          
          # Docker Hub manifests
          docker buildx imagetools create -t flintsh/flare:rolling \
            flintsh/flare:rolling-${{ needs.get-commit-info.outputs.sha }}-amd64 \
            flintsh/flare:rolling-${{ needs.get-commit-info.outputs.sha }}-arm64
          
          docker buildx imagetools create -t flintsh/flare:rolling-${{ needs.get-commit-info.outputs.sha }} \
            flintsh/flare:rolling-${{ needs.get-commit-info.outputs.sha }}-amd64 \
            flintsh/flare:rolling-${{ needs.get-commit-info.outputs.sha }}-arm64

  rolling-release:
    name: Create Rolling Release
    runs-on: ubuntu-latest
    needs: [get-commit-info, docker-manifest]
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update Rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHORT_SHA: ${{ needs.get-commit-info.outputs.sha }}
          RELEASE_DATE: ${{ needs.get-commit-info.outputs.date }}
          RELEASE_MESSAGE: ${{ needs.get-commit-info.outputs.message }}
        run: |
          # The full SHA marker is consumed by Flare's rolling update check.
          # Pass commit messages as data so their contents cannot become shell code.
          python3 - <<'PY'
          import os
          from pathlib import Path

          sha = os.environ["GITHUB_SHA"]
          short_sha = os.environ["RELEASE_SHORT_SHA"]
          repository = os.environ["GITHUB_REPOSITORY"]
          notes = f"""<!-- flare-commit-sha: {sha} -->

          **Rolling Release** - Latest commit: [`{short_sha}`](https://github.com/{repository}/commit/{sha}) ({os.environ["RELEASE_DATE"]})

          ## Changes
          {os.environ["RELEASE_MESSAGE"]}

          ## Docker Images
          - `ghcr.io/flintsh/flare:rolling`
          - `flintsh/flare:rolling`
          - `ghcr.io/flintsh/flare:rolling-{short_sha}`
          - `flintsh/flare:rolling-{short_sha}`

          > ⚠️ **Warning:** This is a pre-release and may be unstable or break. Rolling releases are unsupported.
          """
          Path("release_notes.md").write_text(notes)
          PY

          # Publish the commit marker before moving the public tag, so a failed
          # metadata update leaves the existing release and tag together.
          if gh release view rolling &>/dev/null; then
            gh release edit rolling \
              --title "Rolling Release ($RELEASE_SHORT_SHA)" \
              --notes-file release_notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          else
            gh release create rolling \
              --title "Rolling Release ($RELEASE_SHORT_SHA)" \
              --notes-file release_notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

          # --target does not move an existing tag. Advance it only after the
          # images and the release metadata have both been published.
          git tag --force rolling "$GITHUB_SHA"
          git push --force origin refs/tags/rolling
