name: Meticulous

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      meticulous-commit-sha:
        description: Commit Meticulous has asked this run to build.
        required: false

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: read

env:
  METICULOUS_COMMIT_SHA: "${{ github.event.inputs['meticulous-commit-sha'] || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}"

jobs:
  test:
    name: Meticulous
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: '${{ env.METICULOUS_COMMIT_SHA }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build self-contained Meticulous image
        run: |
          docker build --build-arg METICULOUS_BUILD=true -t flare-meticulous-app .
          docker build -f Dockerfile.meticulous -t "flare:meticulous-$METICULOUS_COMMIT_SHA" .

      - name: Smoke test disposable database and application
        run: |
          docker run -d --name flare-meticulous-smoke -p 3000:3000 "flare:meticulous-$METICULOUS_COMMIT_SHA"
          trap 'docker logs flare-meticulous-smoke; docker rm -f flare-meticulous-smoke' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:3000/api/health; then
              curl --fail --silent http://localhost:3000/auth/login > /dev/null
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' flare-meticulous-smoke)" != true ]; then
              exit 1
            fi
            sleep 2
          done
          exit 1

      - name: Ensure base tests exist
        if: vars.METICULOUS_REPLAY_READY == 'true'
        uses: alwaysmeticulous/report-diffs-action/ensure-base@v1
        with:
          api-token: '${{ secrets.METICULOUS_API_TOKEN }}'
          ref: '${{ env.METICULOUS_COMMIT_SHA }}'

      # Allows the first cloud replay to be verified before enabling PR comparisons.
      - name: Upload bootstrap deployment
        if: vars.METICULOUS_REPLAY_READY != 'true'
        env:
          METICULOUS_API_TOKEN: '${{ secrets.METICULOUS_API_TOKEN }}'
        run: |
          npx --yes @alwaysmeticulous/cli@2.340.0 agent upload-build \
            --localImageTag "flare:meticulous-$METICULOUS_COMMIT_SHA" \
            --containerPort 3000 --containerHealthCheckEndpoint /api/health \
            --commitSha "$METICULOUS_COMMIT_SHA" --json > meticulous-deployment.json
          cat meticulous-deployment.json

      - name: Save bootstrap deployment reference
        if: vars.METICULOUS_REPLAY_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meticulous-deployment
          path: meticulous-deployment.json

      - name: Run Meticulous tests
        if: vars.METICULOUS_REPLAY_READY == 'true'
        uses: alwaysmeticulous/report-diffs-action/upload-container@v1
        with:
          api-token: '${{ secrets.METICULOUS_API_TOKEN }}'
          image-tag: 'flare:meticulous-${{ env.METICULOUS_COMMIT_SHA }}'
          container-port: 3000
          container-health-check-endpoint: /api/health
