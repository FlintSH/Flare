name: Meticulous

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      meticulous-commit-sha:
        description: Commit Meticulous has asked this run to build.
        required: false

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: read

env:
  METICULOUS_COMMIT_SHA: "${{ github.event.inputs['meticulous-commit-sha'] || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}"

jobs:
  test:
    name: Meticulous
    # Enable after Meticulous confirms database and authenticated SSR replay setup.
    if: vars.METICULOUS_REPLAY_READY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure base tests exist
        uses: alwaysmeticulous/report-diffs-action/ensure-base@v1
        with:
          api-token: '${{ secrets.METICULOUS_API_TOKEN }}'
          ref: '${{ env.METICULOUS_COMMIT_SHA }}'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: '${{ env.METICULOUS_COMMIT_SHA }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Meticulous image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: 'flare:meticulous-${{ env.METICULOUS_COMMIT_SHA }}'
          build-args: |
            METICULOUS_BUILD=true

      - name: Run Meticulous tests
        uses: alwaysmeticulous/report-diffs-action/upload-container@v1
        with:
          api-token: '${{ secrets.METICULOUS_API_TOKEN }}'
          image-tag: 'flare:meticulous-${{ env.METICULOUS_COMMIT_SHA }}'
          container-port: 3000
          container-env: |
            METICULOUS_BUILD=true
            DATABASE_URL=${{ secrets.METICULOUS_DATABASE_URL }}
            NEXTAUTH_SECRET=${{ secrets.METICULOUS_NEXTAUTH_SECRET }}
            NEXTAUTH_URL=http://localhost:3000
