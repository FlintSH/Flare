name: Docker Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build-test:
    name: Docker Build Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate platform tag suffix
        id: generate_tag
        run: |
          platform="${{ matrix.platform }}"
          echo "TAG_SUFFIX=${platform//\//-}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: flare:test-${{ steps.generate_tag.outputs.TAG_SUFFIX }}
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.platform }}

      - name: Test Docker container
        run: |
          docker network create flare-network

          docker run -d --name postgres \
            --network flare-network \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=flare_test \
            postgres:16

          timeout=30
          while [ $timeout -gt 0 ]; do
            if docker exec postgres pg_isready -U postgres; then
              break
            fi
            sleep 1
            timeout=$((timeout-1))
          done
          if [ $timeout -eq 0 ]; then
            echo "PostgreSQL failed to become ready"
            exit 1
          fi

          # The image's own startup applies the migrations.
          docker run --name flare-test -d \
            -e DATABASE_URL=postgresql://postgres:postgres@postgres:5432/flare_test \
            -e NEXTAUTH_SECRET=flare-docker-test-disposable-session-secret \
            -e NEXTAUTH_URL=http://localhost:3000 \
            --network flare-network \
            flare:test-${{ steps.generate_tag.outputs.TAG_SUFFIX }}

          # The image's health check ignores failures for 150 seconds, then
          # three failures 10 seconds apart make it unhealthy. Docker also
          # reports a container that has stopped as unhealthy.
          deadline=$((SECONDS + 180))
          while :; do
            state=$(docker inspect --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' flare-test) || state=missing
            if [ "$state" = 'running healthy' ]; then
              echo "Container is healthy"
              exit 0
            fi
            if [ "$state" != 'running starting' ] || [ $SECONDS -ge $deadline ]; then
              break
            fi
            sleep 2
          done
          echo "Container failed to become healthy (status: $state)"
          docker inspect --format '{{json .State.Health}}' flare-test || true
          docker logs flare-test || true
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker stop flare-test postgres || true
          docker rm flare-test postgres || true
          docker network rm flare-network || true 