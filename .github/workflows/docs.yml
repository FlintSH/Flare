name: Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published, edited]
  # Releases created with GITHUB_TOKEN do not trigger release/push workflows.
  workflow_run:
    workflows: [Release, Rolling Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize the whole publishing pipeline across pushes, releases and dispatches.
  group: docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: >-
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_branch == 'main')) &&
      (github.event_name != 'release' ||
        (!github.event.release.draft &&
         (!github.event.release.prerelease || github.event.release.tag_name == 'rolling'))) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      DOCS_BASE: ${{ vars.DOCS_BASE || format('/{0}/', github.event.repository.name) }}
    steps:
      - name: Check out the pull request or pushed source
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check out trusted publishing source
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # Release tags can predate this publishing infrastructure. A release
          # event or completed workflow never supplies executable tooling refs.
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Do not restore or save dependency caches across publishing contexts.
      - name: Install documentation dependencies
        run: npm ci --prefix docs/site
      # The browser and the fonts it renders with install while the site
      # builds; "Wait for the browser" collects the result. A pull request
      # runs its browser tests in the `browser` jobs below instead.
      - name: Start installing the browser
        if: github.event_name != 'pull_request'
        working-directory: docs/site
        run: |
          (npx playwright install --with-deps --only-shell chromium > "$RUNNER_TEMP/browser-install.log" 2>&1 \
            && echo 0 > "$RUNNER_TEMP/browser-install.status" \
            || echo 1 > "$RUNNER_TEMP/browser-install.status") &
      - name: Require documentation with code changes
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          DOCS_COMPARE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:changes --prefix docs/site -- --base "$DOCS_COMPARE_BASE"
      - name: Verify reference coverage
        run: npm run check:coverage --prefix docs/site
      - name: Check documentation formatting
        run: npm run format:check --prefix docs/site
      - name: Build and verify links and assets
        run: npm run build --prefix docs/site
      - name: Test the documentation scripts
        if: github.event_name == 'pull_request'
        working-directory: docs/site
        run: node --test scripts/*.test.mjs
      - name: Wait for the browser
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        run: |
          until [ -f "$RUNNER_TEMP/browser-install.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/browser-install.log"
          exit "$(cat "$RUNNER_TEMP/browser-install.status")"
      - name: Test documentation interactions and responsive layouts
        if: github.event_name != 'pull_request'
        run: npm test --prefix docs/site
      - name: Save browser failure evidence
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-browser-failures
          path: docs/site/test-results
          if-no-files-found: ignore
      # Build the deployable site from the same checkout that passed source
      # checks, without accepting a checkout ref or artifact from another job.
      # A pull request publishes nothing and always checks out one fixed
      # commit, so there the Documentation Releases workflow runs these steps
      # beside this job rather than after it.
      - name: Build stable docs, dated archives and the rolling preview
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:releases --prefix docs/site
      - name: Test stable content, archives, comparisons and explicit rolling access
        if: github.event_name != 'pull_request'
        run: npm run test:releases --prefix docs/site
      - name: Save archive browser failure evidence
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-release-browser-failures
          path: docs/site/test-results
          if-no-files-found: ignore
      - name: Upload stable site, archives and rolling preview
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/.vitepress/releases

  # A pull request's browser tests, split in two so they finish in about half
  # the time. The two groups are one filter and its opposite, so a new test
  # always lands in one of them.
  browser:
    if: github.event_name == 'pull_request'
    name: browser (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: accessibility
            filter: --grep "WCAG accessibility"
          - group: layout and features
            filter: --grep-invert "WCAG accessibility"
    env:
      DOCS_BASE: ${{ vars.DOCS_BASE || format('/{0}/', github.event.repository.name) }}
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pages show when they last changed, which comes from the history.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Do not restore or save dependency caches across publishing contexts.
      - name: Install documentation dependencies
        run: npm ci --prefix docs/site
      # Installs while the site builds; "Wait for the browser" collects it.
      - name: Start installing the browser
        working-directory: docs/site
        run: |
          (npx playwright install --with-deps --only-shell chromium > "$RUNNER_TEMP/browser-install.log" 2>&1 \
            && echo 0 > "$RUNNER_TEMP/browser-install.status" \
            || echo 1 > "$RUNNER_TEMP/browser-install.status") &
      - name: Build the site
        run: npm run build --prefix docs/site
      - name: Wait for the browser
        timeout-minutes: 10
        run: |
          until [ -f "$RUNNER_TEMP/browser-install.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/browser-install.log"
          exit "$(cat "$RUNNER_TEMP/browser-install.status")"
      - name: Test documentation interactions and responsive layouts
        working-directory: docs/site
        run: npx playwright test ${{ matrix.filter }}
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-browser-failures-${{ strategy.job-index }}
          path: docs/site/test-results
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release') && vars.DOCS_PAGES_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
