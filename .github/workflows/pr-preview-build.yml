name: PR Preview Image

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge ref includes support files for older feature branches and
          # exercises any proposed changes to the preview infrastructure itself.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test preview lifecycle and public gateway
        run: |
          node --test scripts/preview/seed.test.cjs scripts/preview/test-gateway.cjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/preview -p 'test_*.py'
          bash -n scripts/preview/boot.sh
          sh -n scripts/preview/start.sh

  image:
    needs: checks
    if: vars.PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # This job deliberately has no registry, Railway, or comment credentials.
      # GitHub's fork-workflow approval policy still applies.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: app
          persist-credentials: false

      - name: Checkout trusted preview support
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: preview-tools
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build disposable preview image
        run: |
          # Build the exact application head with the trusted default branch's
          # disposable startup, including for PR branches predating preview support.
          # Support changes take effect after merge. Never read PR bake files.
          export PREVIEW_ARTIFACT_DIR="$RUNNER_TEMP/preview-artifact"
          mkdir -p "$PREVIEW_ARTIFACT_DIR"
          # Buildx requires the export's parent directory as a filesystem grant.
          docker buildx bake --allow "fs.write=$PREVIEW_ARTIFACT_DIR" --file - preview <<'BAKE'
          variable "PREVIEW_ARTIFACT_DIR" {
            default = ""
          }
          target "app" {
            context = "./app"
            dockerfile = "Dockerfile"
            platforms = ["linux/amd64"]
          }
          target "preview" {
            context = "./preview-tools"
            dockerfile = "Dockerfile.preview"
            contexts = { "flare-preview-app" = "target:app" }
            platforms = ["linux/amd64"]
            output = ["type=oci,dest=${PREVIEW_ARTIFACT_DIR}/image.tar"]
            attest = ["type=provenance,disabled=true", "type=sbom,disabled=true"]
          }
          BAKE

      - name: Upload image for the trusted controller
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flare-pr-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-artifact/image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
