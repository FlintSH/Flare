[package]
name = "flare-upload"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Command-line upload client for Flare with end-to-end encryption"
license = "MIT"
publish = false

[lib]
name = "flare_upload"
path = "src/lib.rs"

[[bin]]
name = "flare-upload"
path = "src/main.rs"

# Every version is exact. Cargo.lock pins the full tree; see README.md.
[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
blake3 = { version = "=1.8.7", default-features = false }
chacha20 = { version = "=0.10.2", default-features = false, features = ["xchacha"] }
getrandom = { version = "=0.4.3" }
lexopt = "=0.3.2"
rpassword = "=7.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
unicode-normalization = { version = "=0.1.26", default-features = false }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "platform-verifier"] }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "=1.9.1", features = ["derive"] }

[dev-dependencies]
curve25519-dalek = { version = "=5.0.0", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
